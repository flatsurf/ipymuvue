name: Build and publish to PyPI
on:
  push: { branches: [ "master" ], tags: [ "*" ] }
  pull_request: { branches: [ "master" ] }

concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch the history of master to check that releases are on master.
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
      - name: Check that the release tag matches the version and is on master
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(pixi run python -c "import ipymuvue; print(ipymuvue.__version__)")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version $version of ipymuvue."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tag $GITHUB_REF_NAME is not on the master branch. Push master before pushing the tag."
            exit 1
          fi
      - name: Build wheel and sdist
        run: pixi run build
      - name: Check that the wheel ships the JupyterLab extension
        run: |
          pixi run python -m zipfile -l dist/*.whl | grep share/jupyter/labextensions/ipymuvue/package.json
          pixi run python -m zipfile -l dist/*.whl | grep share/jupyter/labextensions/ipymuvue/install.json
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  publish:
    # Publish releases tagged by `pixi run release-prepare`, see the README.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    # This requires a trusted publisher to be configured on PyPI, see
    # https://docs.pypi.org/trusted-publishers/
    environment:
      name: pypi
      url: https://pypi.org/p/ipymuvue
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
      - name: Extract release notes from the ChangeLog
        run: |
          python3 - <<'EOF'
          import os, re
          changelog = open("ChangeLog").read()
          version = re.escape(os.environ["GITHUB_REF_NAME"])
          notes = re.search(rf"^v{version}\n=+\n(.*?)(?=^v\d|\Z)", changelog, re.M | re.S)
          open("release-notes.md", "w").write(notes.group(1).strip() + "\n")
          EOF
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
