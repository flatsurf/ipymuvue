name: Documentation
on:
  push: { branches: [ "master" ] }
  pull_request: { branches: [ "master" ] }

concurrency:
  group: docs-${{ github.ref }}
  # Do not cancel deployments to GitHub Pages half way through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: docs
      - name: Build the documentation
        run: pixi run -e docs docs
      - name: Install browser and its system dependencies
        run: pixi run -e docs playwright install --with-deps chromium
      - name: Check that the widgets in the documentation render
        run: pixi run -e docs pytest tests/docs --tracing retain-on-failure --output test-results
      - name: Upload playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-docs
          path: test-results
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
  deploy:
    # Publish the documentation to https://flatsurf.github.io/ipymuvue/
    # This requires the source of GitHub Pages to be set to "GitHub Actions"
    # in the settings of the repository.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
